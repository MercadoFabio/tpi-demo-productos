name: Publicar librería y notificar al Shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@mercadofabio'

      - run: npm ci
      - run: npm version patch --prefix projects/productos-lib --no-git-tag-version
      - run: npx ng build productos-lib
      - run: npm publish ./dist/productos-lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar versión publicada
        run: |
          git config user.name "tpi-demo-bot"
          git config user.email "actions@github.com"
          git add projects/productos-lib/package.json
          git commit -m "chore(release): productos-lib $(node -p "require('./projects/productos-lib/package.json').version") [skip ci]"
          git push

      - name: Notificar al Shell
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ secrets.SHELL_DISPATCH_TOKEN }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MercadoFabio/tpi-demo-shell/actions/workflows/338889131/dispatches \
            --data '{"ref":"main"}'
